# Screenshot di tutte le schermate dell'app nel simulatore, in modalità demo, nelle tre lingue e con il testo grande.
# Si lancia a mano (Actions > screenshot > Run workflow) sul ramo che si vuole controllare.
# Le immagini (JPEG ridotti) si salvano come allegato della prova e anche in cartella `screenshot-ci/` sullo stesso ramo,
# così chi lavora sul codice può guardarle senza scaricare nulla. Quella cartella NON va unita in main: si toglie prima.
name: screenshot

on:
  workflow_dispatch:
  # Sui rami di lavoro parte quando si cambia il file interruttore (serve finché il flusso non è in main:
  # GitHub non lascia lanciare a mano un flusso che esiste solo su un ramo).
  push:
    branches: ['claude/**']
    paths: ['.github/screenshot-interruttore.txt']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  schermate:
    name: Screenshot delle schermate (simulatore iPhone)
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen e genera il progetto
        working-directory: app
        run: |
          brew install xcodegen
          xcodegen

      - name: Sceglie il simulatore
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(r,x) for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone') and 'Pro' not in x['name'] and 'SE' not in x['name'] and 'Plus' not in x['name'] and 'Max' not in x['name'] and 'Air' not in x['name']]
          c.sort(key=lambda t:(t[0],t[1]['name']))
          print(c[-1][1]['udid'])
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID" || true
          xcrun simctl boot "$UDID" || true

      - name: Compila l'app e i test dell'interfaccia
        working-directory: app
        run: |
          set +e
          xcodebuild build-for-testing \
            -project Swimwave.xcodeproj -scheme SwimwaveUITests \
            -destination "id=$UDID" -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee /tmp/log-build.txt
          esito=${PIPESTATUS[0]}
          if [ "$esito" != "0" ]; then
            righe=$(grep -E "error:" /tmp/log-build.txt | sort -u | head -150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build-for-testing fallito::${righe}"
          fi
          exit $esito

      - name: Scatta gli screenshot (lingue e dimensioni del testo)
        working-directory: app
        run: |
          set +e
          mkdir -p /tmp/png
          # nome | lingua | categoria di dimensione del testo
          while IFS='|' read -r nome lingua testo; do
            echo "=== $nome ($lingua, $testo) ==="
            TEST_RUNNER_SCREENSHOT_DIR="/tmp/png/$nome" \
            TEST_RUNNER_SCREENSHOT_LINGUA="$lingua" \
            TEST_RUNNER_SCREENSHOT_TESTO="$testo" \
            xcodebuild test-without-building \
              -project Swimwave.xcodeproj -scheme SwimwaveUITests \
              -destination "id=$UDID" -derivedDataPath /tmp/dd 2>&1 | tee "/tmp/log-$nome.txt" | grep -E "Test Case|error:|failed|passed" | tail -20
          done <<'COMBINAZIONI'
          it-normale|it|UICTContentSizeCategoryL
          it-grande|it|UICTContentSizeCategoryAccessibilityM
          en-normale|en|UICTContentSizeCategoryL
          es-normale|es|UICTContentSizeCategoryL
          es-grande|es|UICTContentSizeCategoryAccessibilityM
          COMBINAZIONI
          find /tmp/png -name '*.png' | wc -l
          exit 0

      - name: Riduce le immagini
        run: |
          mkdir -p screenshot-ci
          rm -rf screenshot-ci/*
          for dir in /tmp/png/*; do
            nome=$(basename "$dir")
            mkdir -p "screenshot-ci/$nome"
            for f in "$dir"/*.png; do
              [ -f "$f" ] || continue
              sips -Z 1100 -s format jpeg -s formatOptions 70 "$f" --out "screenshot-ci/$nome/$(basename "${f%.png}").jpg" >/dev/null
            done
          done
          find screenshot-ci -type f | wc -l
          du -sh screenshot-ci

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot-ci
          if-no-files-found: warn

      - name: Salva le immagini sul ramo (cartella screenshot-ci)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A screenshot-ci
          if git diff --cached --quiet; then echo "nessuna immagine nuova"; exit 0; fi
          git commit -m "Screenshot automatici delle schermate (solo per controllo: non unire in main)"
          for tentativo in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
