# Screenshot di tutte le schermate dell'app nel simulatore, in modalità demo, nelle tre lingue, con il testo grande e nel tema scuro.
# Ogni combinazione gira su una macchina a parte (in parallelo): in tutto circa un quarto d'ora.
# Le immagini (JPEG ridotti) vanno come allegato della prova e anche nella cartella `screenshot-ci/` dello stesso ramo,
# così chi lavora sul codice può guardarle senza scaricare nulla. Quella cartella NON va unita in main: si toglie prima.
name: screenshot

on:
  workflow_dispatch:
  # Sui rami di lavoro parte quando si cambia il file interruttore (serve finché il flusso non è in main:
  # GitHub non lascia lanciare a mano un flusso che esiste solo su un ramo).
  push:
    branches: ['claude/**']
    paths: ['.github/screenshot-interruttore.txt']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  scelta:
    name: Sceglie le combinazioni
    runs-on: ubuntu-latest
    outputs:
      matrice: ${{ steps.m.outputs.matrice }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          # La seconda riga del file interruttore può elencare i nomi da rifare (es. "it-normale it-scuro"); vuota = tutte.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          tutte = [
            {"nome": "it-normale", "lingua": "it", "testo": "UICTContentSizeCategoryL", "aspetto": "light"},
            {"nome": "it-grande",  "lingua": "it", "testo": "UICTContentSizeCategoryAccessibilityM", "aspetto": "light"},
            {"nome": "en-normale", "lingua": "en", "testo": "UICTContentSizeCategoryL", "aspetto": "light"},
            {"nome": "es-normale", "lingua": "es", "testo": "UICTContentSizeCategoryL", "aspetto": "light"},
            {"nome": "es-grande",  "lingua": "es", "testo": "UICTContentSizeCategoryAccessibilityM", "aspetto": "light"},
            {"nome": "it-scuro",   "lingua": "it", "testo": "UICTContentSizeCategoryL", "aspetto": "dark"},
            {"nome": "en-scuro",   "lingua": "en", "testo": "UICTContentSizeCategoryL", "aspetto": "dark"},
          ]
          righe = open(".github/screenshot-interruttore.txt").read().splitlines()
          scelte = righe[1].split() if len(righe) > 1 else []
          scelta = [c for c in tutte if c["nome"] in scelte] if scelte else tutte
          print("matrice=" + json.dumps({"include": scelta or tutte}))
          PY

  schermate:
    name: Screenshot ${{ matrix.nome }}
    needs: scelta
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scelta.outputs.matrice) }}
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen e genera il progetto
        working-directory: app
        run: |
          brew install xcodegen
          xcodegen

      - name: Sceglie e accende il simulatore
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(r,x) for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone') and 'Pro' not in x['name'] and 'SE' not in x['name'] and 'Plus' not in x['name'] and 'Max' not in x['name'] and 'Air' not in x['name']]
          c.sort(key=lambda t:(t[0],t[1]['name']))
          print(c[-1][1]['udid'])
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl ui "$UDID" appearance "${{ matrix.aspetto }}"

      - name: Compila l'app e i test dell'interfaccia
        working-directory: app
        run: |
          set +e
          xcodebuild build-for-testing \
            -project Swimwave.xcodeproj -scheme SwimwaveUITests \
            -destination "id=$UDID" -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee /tmp/log-build.txt
          esito=${PIPESTATUS[0]}
          if [ "$esito" != "0" ]; then
            righe=$(grep -E "error:" /tmp/log-build.txt | sort -u | head -150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build-for-testing fallito::${righe}"
          fi
          exit $esito

      - name: Scatta gli screenshot
        working-directory: app
        run: |
          set +e
          mkdir -p /tmp/png/${{ matrix.nome }}
          TEST_RUNNER_SCREENSHOT_DIR="/tmp/png/${{ matrix.nome }}" \
          TEST_RUNNER_SCREENSHOT_LINGUA="${{ matrix.lingua }}" \
          TEST_RUNNER_SCREENSHOT_TESTO="${{ matrix.testo }}" \
          xcodebuild test-without-building \
            -project Swimwave.xcodeproj -scheme SwimwaveUITests \
            -destination "id=$UDID" -derivedDataPath /tmp/dd 2>&1 | tee /tmp/log-test.txt | grep -E "Test Case|error:|failed" | tail -30
          find /tmp/png -name '*.png' | wc -l
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: png-${{ matrix.nome }}
          path: /tmp/png/${{ matrix.nome }}
          retention-days: 1
          if-no-files-found: warn

  pubblica:
    name: Riduce e pubblica le immagini
    needs: [scelta, schermate]
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: png-*
          path: /tmp/png

      - name: Riduce le immagini
        run: |
          mkdir -p screenshot-ci
          rm -rf screenshot-ci/*
          for dir in /tmp/png/png-*; do
            nome=$(basename "$dir"); nome=${nome#png-}
            mkdir -p "screenshot-ci/$nome"
            for f in "$dir"/*.png; do
              [ -f "$f" ] || continue
              sips -Z 1100 -s format jpeg -s formatOptions 70 "$f" --out "screenshot-ci/$nome/$(basename "${f%.png}").jpg" >/dev/null
            done
          done
          find screenshot-ci -type f | wc -l
          du -sh screenshot-ci

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot-ci
          if-no-files-found: warn

      - name: Salva le immagini sul ramo (cartella screenshot-ci)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A screenshot-ci
          if git diff --cached --quiet; then echo "nessuna immagine nuova"; exit 0; fi
          git commit -m "Screenshot automatici delle schermate (solo per controllo: non unire in main)"
          for tentativo in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
