# Prova di compilazione e test su macchine macOS di GitHub (gratis per i repository pubblici).
# Affianca Codemagic, che resta quello usato per TestFlight.
# Se un passo fallisce, le righe con "error:" vengono ripubblicate come annotazione (leggibile anche senza scaricare i log).
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  pacchetto-swift:
    name: Test del pacchetto SwimwaveCore
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/SwimwaveCore
        run: |
          swift --version
          set +e
          swift test 2>&1 | tee /tmp/log.txt
          esito=${PIPESTATUS[0]}
          if [ "$esito" != "0" ]; then
            righe=$(grep -E "error:|failed|Fatal|XCTAssert" /tmp/log.txt | head -150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=swift test fallito::${righe}"
          fi
          exit $esito

  app-ios:
    name: Compilazione dell'app (iPhone e Watch, senza firma)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Installa XcodeGen e genera il progetto
        working-directory: app
        run: |
          brew install xcodegen
          xcodegen
      - name: Compila l'app iPhone (simulatore)
        working-directory: app
        run: |
          set +e
          xcodebuild build \
            -project Swimwave.xcodeproj -scheme Swimwave \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee /tmp/log.txt
          esito=${PIPESTATUS[0]}
          if [ "$esito" != "0" ]; then
            righe=$(grep -E "error:" /tmp/log.txt | sort -u | head -150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=xcodebuild fallito::${righe}"
          fi
          exit $esito
      - name: Compila l'app Watch e la complicazione (simulatore)
        working-directory: app
        run: |
          set +e
          for schema in SwimwaveWatch SwimwaveWatchComplicazione; do
            xcodebuild build \
              -project Swimwave.xcodeproj -scheme $schema \
              -destination 'generic/platform=watchOS' \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee /tmp/log-$schema.txt
            esito=${PIPESTATUS[0]}
            if [ "$esito" != "0" ]; then
              righe=$(grep -E "error:" /tmp/log-$schema.txt | sort -u | head -150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=xcodebuild $schema fallito::${righe}"
              exit $esito
            fi
          done

  servizio-coach:
    name: Test del servizio coach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: server/coach
        run: |
          npm ci || npm install
          npm test
