<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oggi: tre direzioni grafiche (bozza)</title>
<style>
:root{--navy:#0B2545;--navy2:#134074;--tur:#1FB5C9;--turc:#7FE3EE;--cor:#FF7A66;--coro:#D9573F;--sfondo:#F3FAFB;--t2:#4A5D73;
 --a1:#5CCB9B;--a2:#1FB5C9;--b1:#FFC857;--b2:#FF8A4C;--c1:#9B6BFF;--pagina:#0a1424}
*{box-sizing:border-box}body{margin:0;background:var(--pagina);color:#E8F1F8;font:15px/1.45 "Nunito",ui-rounded,-apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding:22px 14px 48px}h1{font-size:1.4rem;margin:0 0 4px}.sotto{color:#9db4c8;margin:0 0 22px}
.riga{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px 20px;justify-items:center}
figure{margin:0;text-align:center}figcaption{margin-top:12px;font-weight:800}figcaption small{display:block;font-weight:500;color:#9db4c8;max-width:300px;margin:2px auto 0}
.tel{width:300px;height:640px;border-radius:44px;background:#15181c;padding:9px;box-shadow:0 14px 40px #0009,inset 0 0 0 2px #3a3f47}
.sch{text-align:left;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--sfondo);position:relative;color:var(--navy)}
.sch .scroll{position:absolute;inset:0 0 56px 0;overflow:hidden}
.barra{position:absolute;left:0;right:0;bottom:0;height:56px;background:#fff;border-top:1px solid #e3eef1;display:flex;justify-content:space-around;align-items:center}
.barra i{width:22px;height:22px;border-radius:7px;background:#c9d8de;display:block}.barra i.on{background:var(--tur)}
.testa{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:34px 18px 34px;position:relative}
.testa h2{margin:0;font-size:21px;font-weight:900}.testa p{margin:2px 0 0;color:var(--turc);font-size:13px;font-weight:700}
.onda{position:absolute;left:0;right:0;bottom:-1px;height:16px;background:var(--sfondo);clip-path:polygon(0 60%,10% 40%,20% 60%,30% 40%,40% 60%,50% 40%,60% 60%,70% 40%,80% 60%,90% 40%,100% 60%,100% 100%,0 100%)}
.cont{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.carta{background:#fff;border-radius:20px;padding:14px;box-shadow:0 2px 10px #0b254512}
.carta h3{margin:0;font-size:13px;color:var(--t2);font-weight:800}
.num{font-size:34px;font-weight:900;line-height:1.1}.barra2{height:9px;border-radius:5px;background:#dcebef;overflow:hidden;margin:6px 0}.barra2 i{display:block;height:100%;width:33%;background:var(--tur);border-radius:5px}
.fr{color:var(--t2);font-size:13px}
.riga-p{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px}
.cerchio{width:18px;height:18px;border-radius:50%;border:2px solid #b5c6cc;display:inline-block;flex:none}.cerchio.ok{background:var(--tur);border-color:var(--tur)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{background:#e6f3f6;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:800}
.serie{font-size:12.5px;color:var(--t2);margin:2px 0}
.btn{margin-top:10px;background:var(--cor);color:var(--navy);text-align:center;border-radius:99px;padding:12px;font-weight:900;font-size:16px;box-shadow:0 4px 0 var(--coro)}
.titolo-w{font-size:19px;font-weight:900;margin:2px 0}
/* A: colori per tipologia */
.pill{border-radius:99px;padding:3px 10px;font-weight:900;font-size:12px;color:var(--navy);display:inline-block}
.a1{background:var(--a1)}.a2{background:var(--a2)}.b1{background:var(--b1)}.b2{background:var(--b2)}.c1{background:var(--c1);color:#fff}
.A .riga-p .pill{min-width:34px;text-align:center}
.A .carta.w{border-top:6px solid var(--a2)}
.A .scala{display:flex;gap:4px;margin-top:8px}.A .scala i{flex:1;height:6px;border-radius:3px}
.fiamma{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--navy);padding:0 4px}
.fiamma svg{width:22px;height:22px}
/* B: carta eroe */
.eroe{border-radius:24px;background:linear-gradient(150deg,var(--navy) 0%,var(--navy2) 45%,#1a8fb0 100%);color:#fff;padding:16px;position:relative;overflow:hidden;box-shadow:0 8px 22px #0b254533}
.eroe .tag{display:inline-block;background:#ffffff26;border-radius:99px;padding:3px 10px;font-weight:800;font-size:12px;color:#fff}
.eroe .titolo-w{color:#fff;font-size:22px;margin:30px 0 2px}
.eroe .chip{background:#ffffff26;color:#fff}.eroe .serie{color:#d6ecf5}
.eroe canvas{position:absolute;right:-4px;top:2px;width:120px;height:60px}
.eroe .btn{box-shadow:0 4px 0 var(--coro)}
.eroe .bolle i{position:absolute;border:1.5px solid #7FE3EEaa;border-radius:50%}
.sezione{font-size:12px;font-weight:900;color:var(--t2);letter-spacing:.05em;margin:2px 4px -4px}
</style></head><body><main>
<h1>Oggi: com'è e due direzioni nuove <span style="background:#FF7A66;color:#0B2545;border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:800;margin-left:8px">BOZZA</span></h1>
<p class="sotto">Stessi contenuti, tre impostazioni grafiche. Le tipologie hanno un colore ciascuno, dal calmo (verde) al forte (viola).</p>
