:root{--navy:#0B2545;--navy-chiaro:#134074;--turchese:#1FB5C9;--corallo:#FF7A66;--pagina:#0a1424;--testo:#E8F1F8;--testo-2:#9db4c8}

<h1>Squalo animato <span class="etichetta">BOZZA</span></h1>
<p class="sotto">Una sola immagine, tagliata in fettine che ondeggiano una dopo l'altra, più forte verso la coda. Con le bolle che salgono, la scia mentre nuota e il salto a fine allenamento. È la stessa tecnica che metto nell'app Watch.</p>

function onda(cv,fase,amp){const c=cv.getContext("2d");c.clearRect(0,0,cv.width,cv.height);const n=24,w=cv.width/n;
 for(let i=0;i<n;i++){const x=i*w,pos=i/(n-1),peso=Math.pow(1-pos,1.6),dy=Math.sin(fase-pos*4.2)*amp*peso*cv.height;
  c.save();c.beginPath();c.rect(x-.4,-cv.height,w+.8,cv.height*3);c.clip();c.translate(0,dy);c.drawImage(img,0,0,cv.width,cv.height);c.restore();}}
const g=document.getElementById("g"),w1=document.getElementById("w1"),w2=document.getElementById("w2"),w3=document.getElementById("w3");
const riduci=matchMedia("(prefers-reduced-motion: reduce)").matches;
function giro(ms){const t=ms/1000;
 onda(g,riduci?0:t*8,riduci?0:.085);
 onda(w1,riduci?0:t*2.2,.03);onda(w2,riduci?0:t*8,.085);onda(w3,riduci?0:t*2.2,.03);
 w1.style.transform="translateY("+(riduci?0:Math.sin(t*1.4)*2)+"px) rotate(6deg)";
 w2.style.transform="translate("+((t%8)/8*110)+"px,"+(riduci?0:Math.sin(t*3.5))+"px) rotate(6deg)";
 w3.style.transform="translateY("+(riduci?0:Math.sin(t*1.4)*2)+"px) rotate(6deg)";
 requestAnimationFrame(giro);}
img.onload=()=>requestAnimationFrame(giro);
const f=[1,2,3,4].map(i=>document.getElementById("f"+i));
const AZZ="#7FE3EE";
function bolle(cx,x,yc,t,nuota,salita,w){cx.save();cx.scale(2,2);
 const bx0=x+w*.96,by0=yc+w*.07;
 for(let k=0;k<3;k++){const ciclo=1.5+.4*k,p=((t/ciclo)+k*.37)%1,bx=bx0+2+k*1.5-p*(nuota?9:2),by=by0-p*salita,d=1.8+k*.9;
  cx.beginPath();cx.arc(bx,by,d/2,0,6.283);cx.strokeStyle="rgba(127,227,238,"+(Math.sin(p*Math.PI)*.85)+")";cx.lineWidth=.9;cx.stroke();}
 if(nuota)for(let j=0;j<3;j++){const q=((t*1.6)+j*.33)%1,x1=x-2-q*14,y=yc+(j-1)*4;cx.beginPath();cx.moveTo(x1,y);cx.lineTo(x1+5,y);cx.strokeStyle="rgba(127,227,238,"+((1-q)*.6)+")";cx.lineWidth=1.4;cx.lineCap="round";cx.stroke();}
 cx.restore();}
function festa(cx,t){const c=cx; c.save(); c.scale(2,2);
 const q=(t/2.6)%1,salto=q>.5?(q-.5)/.5:-1,alt=salto>=0?Math.sin(salto*Math.PI)*36:0,acqua=76;
 if(salto>=0){const x=61,w=60,h=29,yb=acqua-14-alt;
  c.save();c.translate(x+w/2,yb+h/2);c.rotate((-22+salto*44)*Math.PI/180);c.drawImage(img,-w/2,-h/2,w,h);c.restore();
  if(salto<.35){for(let k=0;k<5;k++){const a=k/4*Math.PI,r=salto*50;c.beginPath();c.arc(91+Math.cos(a)*r*.9,acqua-Math.sin(a)*r,1.6,0,6.283);c.fillStyle="rgba(127,227,238,"+(1-salto/.35)+")";c.fill();}}}
 c.beginPath();c.moveTo(0,acqua+14);c.lineTo(0,acqua);for(let X=0;X<=182;X+=2)c.lineTo(X,acqua+Math.sin(X/11+t*2)*3.5);c.lineTo(182,acqua+14);c.closePath();c.fillStyle="rgba(31,181,201,.7)";c.fill();
 c.restore();}
function effetti(ms){const t=ms/1000;
 f.forEach(c=>c.getContext("2d").clearRect(0,0,364,452));
 if(!riduci){
  bolle(f[0].getContext("2d"),68,96+16,t,false,22,64);
  bolle(f[1].getContext("2d"),14+((t%8)/8*110),130+10,t,true,12,40);
  bolle(f[2].getContext("2d"),128,130+10,t,false,12,40);
  festa(f[3].getContext("2d"),t);}
 requestAnimationFrame(effetti);}
img.addEventListener("load",()=>requestAnimationFrame(effetti));
if(img.complete)requestAnimationFrame(effetti);
